{% extends "base.html" %}

{% block title %}Carte Interactive - Hub'eau{% endblock %}

{% block content %}
<div class="h-screen flex flex-col">
    <!-- En-tête simple -->
    <div class="bg-white shadow-sm border-b border-gray-200 p-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Stations Hydrométriques de France</h1>
                <p class="text-gray-600">{{ total_stations }} stations disponibles</p>
            </div>
            <!-- Légende -->
            <div class="flex items-center space-x-4 text-sm">
                <div class="flex items-center">
                    <div class="w-3 h-3 rounded-full bg-green-500 mr-2"></div>
                    <span>En service</span>
                </div>
                <div class="flex items-center">
                    <div class="w-3 h-3 rounded-full bg-red-500 mr-2"></div>
                    <span>Hors service</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Carte plein écran -->
    <div class="flex-1 relative">
        <div id="map" class="w-full h-full"></div>
        
        <!-- Indicateur de chargement -->
        <div id="loading" class="absolute inset-0 bg-white bg-opacity-75 flex items-center justify-center">
            <div class="text-center">
                <i class="fas fa-spinner fa-spin text-3xl text-blue-600 mb-2"></i>
                <p class="text-gray-600">Chargement de la carte...</p>
            </div>
        </div>
    </div>
</div>

<!-- Leaflet CSS et JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Données des stations depuis Flask
    const stationsData = {{ stations|tojson }};
    console.log('Stations chargées:', stationsData.length);
    
    // Initialiser la carte
    const map = L.map('map').setView([46.603354, 1.888334], 6);
    
    // Ajouter les tuiles OpenStreetMap
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);
    
    // Masquer l'indicateur de chargement
    document.getElementById('loading').style.display = 'none';
    
    // Ajouter les stations sur la carte
    stationsData.forEach(station => {
        if (station.latitude_station && station.longitude_station) {
            // Déterminer la couleur selon le statut
            const isActive = station.en_service;
            const color = isActive ? '#10b981' : '#ef4444'; // vert ou rouge
            
            // Créer le marqueur avec la bonne couleur
            const marker = L.circleMarker([station.latitude_station, station.longitude_station], {
                radius: 6,
                fillColor: color,
                color: '#ffffff',
                weight: 2,
                opacity: 1,
                fillOpacity: 0.8
            });
            
            // Popup avec nom, code et lien vers détails
            const popupContent = `
                <div style="min-width: 200px;">
                    <h3 style="margin: 0 0 8px 0; font-weight: bold;">${station.libelle_station}</h3>
                    <p style="margin: 0 0 8px 0; color: #666;">Code: ${station.code_station}</p>
                    <p style="margin: 0 0 12px 0;">
                        <span style="display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 12px; ${isActive ? 'background-color: #dcfce7; color: #166534;' : 'background-color: #fee2e2; color: #dc2626;'}">
                            ${isActive ? 'En service' : 'Hors service'}
                        </span>
                    </p>
                    <a href="/station/${station.code_station}" 
                       style="display: inline-block; padding: 6px 12px; background-color: #3b82f6; color: white; text-decoration: none; border-radius: 4px; font-size: 14px;">
                        Voir les détails
                    </a>
                </div>
            `;
            
            // Ajouter le popup au marqueur
            marker.bindPopup(popupContent);
            
            // Ajouter le marqueur à la carte
            marker.addTo(map);
        }
    });
    
    console.log('Carte initialisée avec', stationsData.length, 'stations');
});
</script>
{% endblock %}

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Hub'eau - Stations de mesure{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50">
    <header>
            <nav class="navbar">
                <div class="nav-left">
                    <img src="{{ url_for('static', filename='hubleau_logo.png') }}" alt="Logo HUBLEAU" class="logo">
                    <span class="brand">HUBLEAU</span>
                </div>
                <div class="nav-right">
                    <a href="#">Accueil</a>
                    <a href="#">Recherche filtré</a>
                    <a href="#">Contact</a>
                </div>
            </nav>

    </header>
    {% block content %}{% endblock %}
</body>
</html>
